name: Supabase Keep-Alive Ping

# Supabase free-tier projects pause after 7 days of inactivity.
# This workflow hits /health/deep every 3 days to keep the DB awake.
# /health/deep runs a real SELECT 1 — a plain /health that doesn't touch
# Postgres would NOT reset Supabase's inactivity timer.

on:
  schedule:
    - cron: "0 12 */3 * *"  # every 3 days at noon UTC
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health/deep
    runs-on: ubuntu-latest
    steps:
      - name: Ping deep health endpoint
        run: |
          curl -sf https://vigil-59y0.onrender.com/health/deep || exit 1
