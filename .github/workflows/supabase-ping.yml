name: Supabase Keep-Alive Ping (manual)

# Manual fallback only. The scheduled keep-alive runs on cron-job.org, which
# calls /health/deep every 3 days. It moved off GitHub Actions because GitHub
# disables scheduled workflows in public repos after 60 days without repository
# activity, which would let Supabase pause silently once the repo goes quiet.
# /health/deep runs a real SELECT 1; a plain /health that doesn't touch
# Postgres would NOT reset Supabase's inactivity timer.

on:
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health/deep
    runs-on: ubuntu-latest
    steps:
      - name: Ping deep health endpoint
        run: |
          curl -sf https://vigil-59y0.onrender.com/health/deep || exit 1
